name: Regenerate EDA portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib
      - name: Run full pipeline
        run: python src/run_all.py
      - name: Upload regenerated artefacts
        uses: actions/upload-artifact@v4
        with:
          name: eda-artefacts
          path: |
            assets/
            cases/
            docs/img/
